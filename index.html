<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohamed aymane Lafhaili | Portfolio</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#12333f;height:100vh;display:flex;flex-direction:column;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
  .topbar{color:#fff;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 24px;letter-spacing:2px;font-size:14px}
  .topbar>span:first-child{justify-self:start}
  .topbar>span#counter{justify-self:center}
  .topbar>div{justify-self:end}
  .zoomctrl{display:flex;align-items:center;gap:8px}
  .zoomctrl button{background:rgba(255,255,255,.1);border:none;color:#fff;width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:16px}
  .zoomctrl button:hover{background:rgba(255,255,255,.25)}
  .zoomctrl input[type=range]{width:110px}
  .fitbtn{background:rgba(255,255,255,.1);border:none;color:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;letter-spacing:1px}
  .fitbtn:hover{background:rgba(255,255,255,.25)}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;gap:20px}
  .pageBox{height:85vh;width:140vh;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden;position:relative;cursor:grab;transition:.3s}
  .pageBox.dragging{cursor:grabbing}
  .page{position:absolute;top:50%;left:50%;height:100%;width:100%;object-fit:contain;user-select:none;pointer-events:none;
        transform:translate(-50%,-50%) scale(var(--z,1)) translate(var(--tx,0px),var(--ty,0px));}
  .nav{background:rgba(255,255,255,.08);border:none;color:#fff;font-size:28px;width:48px;height:48px;border-radius:50%;cursor:pointer;transition:.2s;flex:none}
  .nav:hover{background:rgba(255,255,255,.2)}
  .nav:disabled{opacity:.2;cursor:default}
  .bottom{color:#cfd8dc;text-align:center;padding:10px;font-size:12px;letter-spacing:2px}

  body.full{overflow:hidden}
  body.full .stage{padding:0}
  body.full .pageBox{height:85vh;width:100vw;max-width:100vw;box-shadow:none}
  body.full .bottom{display:none}
  body.full .topbar,body.full .nav{opacity:0;pointer-events:none;transition:opacity .3s}
  body.full.show-ui .topbar,body.full.show-ui .nav{opacity:1;pointer-events:auto}

  @media (max-width:700px){
    .pageBox{height:72vh;width:92vw}
    .nav{width:36px;height:36px;font-size:20px}
  }
</style>
</head>
<body>
  <div class="topbar">
    <span>ARCHITECTURE | PORTFOLIO</span>
    <span id="counter">1 / 49</span>
    <div style="display:flex;align-items:center;gap:14px">
      <div class="zoomctrl">
        <button id="zoomOut">−</button>
        <input type="range" id="zoomRange" min="100" max="400" value="100">
        <button id="zoomIn">+</button>
      </div>
      <button class="fitbtn" id="fitBtn">⛶ PLEIN ÉCRAN</button>
    </div>
  </div>

  <div class="stage">
    <button class="nav" id="prev">&#10094;</button>
    <div class="pageBox" id="pageBox"><img class="page" id="pageImg"></div>
    <button class="nav" id="next">&#10095;</button>
  </div>

  <div class="bottom">FLECHES POUR TOURNER — ZOOM EN HAUT POUR AGRANDIR L'IMAGE — GLISSER POUR NAVIGUER DANS LA PAGE ZOOMEE</div>

<script>
const TOTAL = 49; // change if needed
const pageBox = document.getElementById('pageBox');
const pageImg = document.getElementById('pageImg');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const zoomRange = document.getElementById('zoomRange');
let current = 1;
let isFlipping = false;
let zoom = 1;
let tx = 0, ty = 0;

function resetPan(){ tx=0; ty=0; pageBox.style.setProperty('--tx','0px'); pageBox.style.setProperty('--ty','0px'); }

function render(){
  pageImg.src = current + '.png';
  counter.textContent = current + ' / ' + TOTAL;
  prevBtn.disabled = current <= 1;
  nextBtn.disabled = current >= TOTAL;
  isFlipping = false;
  resetPan();
}

function nextPage(){ if(isFlipping) return; if(current < TOTAL){ isFlipping=true; current++; render(); } }
function prevPage(){ if(isFlipping) return; if(current > 1){ isFlipping=true; current--; render(); } }

nextBtn.onclick = nextPage;
prevBtn.onclick = prevPage;
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') nextPage();
  if(e.key==='ArrowLeft') prevPage();
});

document.querySelector('.stage').addEventListener('click', e=>{
  if(e.target.closest('.nav') || e.target.closest('.pageBox')) return;
});

let dragging=false, sx=0, sy=0;
pageBox.addEventListener('mousedown', e=>{
  if(zoom<=1) return;
  dragging=true; pageBox.classList.add('dragging'); sx=e.clientX; sy=e.clientY;
});
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  tx += (e.clientX-sx)/zoom; ty += (e.clientY-sy)/zoom;
  sx=e.clientX; sy=e.clientY;
  pageBox.style.setProperty('--tx', tx+'px');
  pageBox.style.setProperty('--ty', ty+'px');
});
window.addEventListener('mouseup', ()=>{ dragging=false; pageBox.classList.remove('dragging'); });

function setZoom(v){
  zoom = v;
  pageBox.style.setProperty('--z', zoom);
  resetPan();
}
zoomRange.addEventListener('input', ()=> setZoom(+zoomRange.value/100));
document.getElementById('zoomIn').onclick = ()=>{ const v=Math.min(400,+zoomRange.value+20); zoomRange.value=v; setZoom(v/100); };
document.getElementById('zoomOut').onclick = ()=>{ const v=Math.max(100,+zoomRange.value-20); zoomRange.value=v; setZoom(v/100); };

const fitBtn = document.getElementById('fitBtn');
fitBtn.onclick = ()=>{
  document.body.classList.toggle('full');
  const isFull = document.body.classList.contains('full');
  fitBtn.textContent = isFull ? '↙ QUITTER' : '⛶ PLEIN ÉCRAN';
  if(isFull && document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(()=>{});
  } else if(!isFull && document.fullscreenElement){
    document.exitFullscreen().catch(()=>{});
  }
  if(isFull) revealUI();
};
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement) document.body.classList.remove('full');
  fitBtn.textContent = document.body.classList.contains('full') ? '↙ QUITTER' : '⛶ PLEIN ÉCRAN';
});

// auto-hide topbar + nav in full mode, reveal on movement/keys
let uiTimer;
function revealUI(){
  if(!document.body.classList.contains('full')) return;
  document.body.classList.add('show-ui');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(()=> document.body.classList.remove('show-ui'), 2000);
}
document.addEventListener('mousemove', revealUI);
document.addEventListener('click', revealUI);
document.addEventListener('keydown', revealUI);

render();
</script>
</body>
</html>
